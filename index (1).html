        <a href="#top" className="logo mag"><Star size={30} />URUK</a>

        <div style={{ display: "flex", alignItems: "center", gap: 22 }}>
          <div className="st"><s className={open ? "" : "off"} />{open ? "OPEN NOW" : "OPENS 12 PM"} · MANAMA</div>
          <button className="btn sm mag" onClick={() => book()} style={{ display: sy >= 0 ? "inline-flex" : "none" }}>RESERVE A TABLE</button>
          <button className="bg" onClick={() => setMob(!mob)} aria-label="Menu">{mob ? <X size={26} /> : <Menu size={26} />}</button>
        </div>
      </header>
      <div className={"mob" + (mob ? " on" : "")}>{NAV.map(([n, id]) => <a key={id} href={"#" + id} onClick={() => setMob(false)}>{n}</a>)}<button className="btn solid" onClick={() => book()}>RESERVE A TABLE</button></div>

      <section className="hero" id="top">
        <div className="ph" style={{ transform: `translateY(${sy * 0.22}px)` }}><Img id="hero" w={2000} /></div>
        <div className="ov" /><div className="wm" aria-hidden>أوروك</div>
        <div className="hin">
          <p className="eye rise" style={{ animationDelay: "2.3s" }}>FROM THE CRADLE OF CIVILIZATION TO THE HEART OF MANAMA</p>
          <h1 className="mono rise" style={{ animationDelay: "2.6s" }}>URUK</h1>
          <p className="sub rise" style={{ animationDelay: "3s" }}>Five thousand years after Gilgamesh walked its walls, the fires of Mesopotamia burn again on Exhibitions Avenue.</p>
          <div className="ctas rise" style={{ animationDelay: "3.3s" }}><button className="btn solid mag" onClick={() => book()}>RESERVE YOUR TABLE</button><a className="btn mag" href="#menus">EXPLORE THE MENU</a></div>
        </div>
        <a href="#legend" className="tal" aria-label="Scroll down"><Star size={34} /></a>
      </section>

      <div className="mq" aria-hidden><div>{[0, 1, 2, 3].map((i) => <span key={i}>{mq}</span>)}</div></div>

      <section className="sec lap" id="legend">
        <div className="wm" style={{ right: "-4%", top: "6%" }} aria-hidden>أوروك</div>
        <div className="wrap g2">
          <div className="imgs">
            <div className="fr f1" style={{ transform: `translateY(${(sy - 900) * -0.05}px)` }}><div className="ph"><Img id="plate" /></div><Corners /></div>
            <div className="fr f2" style={{ transform: `translateY(${(sy - 900) * 0.07}px)` }}><div className="ph"><Img id="food" /></div></div>
            <div className="seal">
              <svg viewBox="0 0 200 200"><defs><path id="cp" d="M100,100 m-84,0 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0" /></defs><circle cx="100" cy="100" r="98" fill="none" stroke={G} strokeOpacity=".5" /><circle cx="100" cy="100" r="66" fill="none" stroke={G} strokeOpacity=".35" /><text fill={G2} fontSize="9.5" fontFamily="Plus Jakarta Sans" letterSpacing="2" textLength="520" lengthAdjust="spacing"><textPath href="#cp">AUTHENTIC IRAQI CUISINE • EST. IN BAHRAIN • EXHIBITIONS AVE •</textPath></text></svg>
              <Star size={52} />
            </div>
          </div>
          <div>
            <R><p className="kick">THE LEGEND OF URUK</p><h2 className="h2">Where the first city <em>learned to feast</em></h2></R>
            <R d={150}><p className="cp" style={{ margin: "30px 0 18px" }}>Uruk was the city of Gilgamesh, of the first written word and the first great kitchens of the Tigris and Euphrates. Barley, dates, river fish and fire fed the people who invented civilisation.</p>
              <p className="cp">We carry that table to Manama. Our lamb is minced by hand, our masgouf is staked beside a wood fire, and our samoon is baked on stone. Our waiters, in immaculate suits, welcome you with the oldest Iraqi custom there is: you are the guest, and the guest is sacred.</p></R>
            <R d={250}><div className="stats"><div><b>5,000</b><span>YEARS OF TABLE</span></div><div><b>4.1</b><span>FROM 3,700+ GUESTS</span></div><div><b>1 AM</b><span>LAST GRILL</span></div></div></R>
          </div>
        </div>
      </section>

      <section className="sec lap" id="hearth" style={{ background: "#110E0C" }}>
        <div className="wrap">
          <R><p className="kick">THE SACRED HEARTH</p><h2 className="h2" style={{ maxWidth: 800 }}>Three pillars, <em>one fire</em></h2></R>
          <div className="tri">
            {PIL.map((p, i) => (
              <div key={i} className={"arch" + (ac === i ? " on" : "")} onMouseEnter={() => setAc(i)} onClick={() => setAc(i)}>
                <div className="ph" style={{ position: "absolute", inset: 0 }}><Img id={p.img} w={1100} /></div>
                <div className="vt">{p.t}</div>
                <div className="ac"><Flame size={20} color={G2} /><p className="kick" style={{ margin: "10px 0 0" }}>{p.s.toUpperCase()}</p><h3>{p.t}</h3><p className="cp" style={{ color: "#d9cfbf", fontSize: 14 }}>{p.l}</p></div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <Lattice />

      <section className="sec lap" id="menus">
        <div className="wrap">
          <R><p className="kick">THE TASTING LIST</p><h2 className="h2">Menus of the <em>two rivers</em></h2></R>
          <div className="tabs" role="tablist">{MENU.map((m, i) => <button key={i} role="tab" aria-selected={tab === i} className={"tab" + (tab === i ? " on" : "")} onClick={() => setTab(i)}>{m.k}</button>)}</div>
          <div className="mg">
            <div key={tab} className="fd">
              {M.items.map(([n, d, t, p]) => (
                <div className="it" key={n}><div><h3>{n}<span className="tg">{t}</span></h3><p className="cp" style={{ fontSize: 13.5, marginTop: 4 }}>{d}</p></div><div className="pr"><small>BHD</small>{p.toFixed(3)}</div></div>
              ))}
              <p style={{ fontSize: 11, letterSpacing: ".12em", color: "#6f675c", marginTop: 20 }}>Prices in Bahraini Dinar. Subject to change; please confirm when you book.</p>
            </div>
            <div className="pv" onMouseMove={mv}>
              <div key={tab} className="fd">
                <div className="pvi ph"><Img id={M.img} w={1000} /><Corners /></div>
                <div className="note"><p className="kick" style={{ marginBottom: 8 }}>CHEF'S TASTING NOTE</p><p>{M.note}</p></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section className="sec lap" id="spaces" style={{ background: "#110E0C" }}>
        <div className="wrap">
          <R><p className="kick">THE SPACES</p><h2 className="h2">Sanctuary <em>&amp; majlis</em></h2></R>
          <div className="rooms">{SP.map((s, i) => <button key={i} className={"rm" + (sp === i ? " on" : "")} onClick={() => setSp(i)}>{s.n}</button>)}</div>
          <div className="sw" key={sp}>
            <div className="sb fd"><div className="ph"><Img id={S.img} w={1100} /></div><Corners /></div>
            <div className="fd">
              <span className="badge"><Users size={14} />{S.cap.toUpperCase()}</span>
              <h3 className="serif" style={{ fontSize: 46, margin: "26px 0 14px", lineHeight: 1.1 }}>{S.n}</h3>
              <p className="cp">{S.d}</p>
              <ul className="fl">{S.f.map((x) => <li key={x}><Check size={15} color={G} />{x}</li>)}</ul>
              <button className="btn solid mag" onClick={() => book(S.seat)}>{sp === 0 ? "RESERVE THE HALL" : "SEND A VIP INQUIRY"}</button>
            </div>
          </div>
        </div>
      </section>

      <section className="sec lap" id="voices">
        <div className="wrap">
          <R><div style={{ textAlign: "center" }}><p className="kick">ACCLAIM &amp; GUEST VOICES</p><div className="rat">4.1</div>
            <div style={{ display: "flex", gap: 6, justifyContent: "center", margin: "6px 0" }}>{[0, 1, 2, 3].map((i) => <StarIc key={i} size={18} fill={G} color={G} />)}<StarIc size={18} color={G} /></div>
            <p style={{ fontSize: 11, letterSpacing: ".28em", color: "#A89F91" }}>ACROSS 3,700+ GUEST REVIEWS</p></div></R>
          <div className="qt" key={rv}>
            <div className="fd"><p className="q">“{REV[rv][0]}”</p><p style={{ marginTop: 26, fontSize: 11, letterSpacing: ".24em", color: G }}>{REV[rv][1].toUpperCase()}</p></div>
          </div>
          <div className="dots">
            <button onClick={() => setRv((rv + REV.length - 1) % REV.length)} aria-label="Previous" style={{ width: 30, color: G2, background: "none" }}><ChevronLeft size={20} /></button>
            {REV.map((_, i) => <button key={i} className={rv === i ? "on" : ""} onClick={() => setRv(i)} aria-label={"Review " + (i + 1)} />)}
            <button onClick={() => setRv((rv + 1) % REV.length)} aria-label="Next" style={{ width: 30, color: G2, background: "none" }}><ChevronRight size={20} /></button>
          </div>
          <p style={{ textAlign: "center", fontSize: 11, color: "#6f675c", marginTop: 30 }}>Voices paraphrased from recurring themes in guest reviews.</p>
        </div>
      </section>

      <footer className="ft">
        <Lattice />
        <div className="wrap">
          <div className="fg">
            <div><div className="logo" style={{ marginBottom: 18 }}><Star size={34} />URUK</div><p style={{ maxWidth: 280 }}>Elevated Iraqi and Mesopotamian fine dining, from the cradle of civilization to Manama.</p></div>
            <div><h4>FIND US</h4><p>Exhibitions Ave, Manama<br />Kingdom of Bahrain</p><a href="https://maps.app.goo.gl/BZdJhSmfuEkr8fd97" target="_blank" rel="noreferrer" style={{ color: G2, display: "flex", gap: 8, alignItems: "center" }}><MapPin size={14} />Open in Google Maps</a></div>
            <div><h4>HOURS</h4><p style={{ display: "flex", gap: 8, alignItems: "center" }}><Clock size={14} color={G} />Monday – Sunday</p><p>12:00 PM – 1:00 AM</p><p>Lunch, dinner and late-night dining</p></div>
            <div><h4>RESERVATIONS</h4><a href="tel:+97317291500" style={{ color: G2, fontSize: 20, fontFamily: "'Cormorant Garamond',serif" }}>+973 1729 1500</a><p style={{ marginTop: 10 }}>Dress code: Smart Casual / Traditional Elegance</p></div>
          </div>
          <div className="cr"><span>© {new Date().getFullYear()} URUK RESTAURANT · مطعم أوروك</span><span>EXHIBITIONS AVE, MANAMA, BAHRAIN</span></div>
        </div>
      </footer>
      <Drawer o={res.o} seat={res.seat} close={() => setRes({ ...res, o: false })} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
